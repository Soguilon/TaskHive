<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meetings — TaskHive</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(async function(){
  const session = buildShell('meetings.html');
  if (!session) return;
  Theme.init();
  const content = document.getElementById('thContent');
  content.innerHTML = '<h4 class="mb-3"><i class="fa-solid fa-calendar-check me-2"></i>Meetings</h4><div id="grid" class="th-grid cols-3">'+thLoadingHtml()+'</div>';

  const [mr, pr, tr] = await Promise.all([Api.call('getMeetings'), Api.call('getProjects'), Api.call('getTasks')]);
  const grid = document.getElementById('grid');
  if (!mr.success){ grid.innerHTML = thEmptyHtml('fa-triangle-exclamation', mr.message); return; }
  const projects = pr.success ? pr.data : [];
  const myProjectIds = tr.success ? Array.from(new Set(tr.data.filter(t=>t.AssignedMemberID===session.id).map(t=>t.ProjectID))) : [];
  const meetings = mr.data.filter(m=>!m.ProjectID || myProjectIds.includes(m.ProjectID));
  function projectName(id){ const p = projects.find(x=>x.ProjectID===id); return p?p.ProjectName:'General'; }

  grid.innerHTML = meetings.length ? meetings.map(m=>
    '<div class="th-card"><div class="d-flex justify-content-between mb-2"><h6 class="mb-0">'+thEscape(m.Title)+'</h6>'+
    '<span class="badge-status '+(m.Status==='Cancelled'?'badge-needs-revision':'badge-approved')+'">'+m.Status+'</span></div>'+
    '<p class="text-secondary-th" style="font-size:.85rem;">'+thEscape(m.Description||'')+'</p>'+
    '<div style="font-size:.82rem;" class="mb-1"><i class="fa-solid fa-folder me-2 text-secondary-th"></i>'+thEscape(projectName(m.ProjectID))+'</div>'+
    '<div style="font-size:.82rem;" class="mb-1"><i class="fa-solid fa-calendar me-2 text-secondary-th"></i>'+thFmtDate(m.Date)+' '+thEscape(m.Time||'')+'</div>'+
    (m.Location?'<div style="font-size:.82rem;" class="mb-1"><i class="fa-solid fa-location-dot me-2 text-secondary-th"></i>'+thEscape(m.Location)+'</div>':'')+
    (m.MeetingLink?'<div style="font-size:.82rem;"><i class="fa-solid fa-link me-2 text-secondary-th"></i><a href="'+thEscape(m.MeetingLink)+'" target="_blank">Join link</a></div>':'')+
    '</div>'
  ).join('') : thEmptyHtml('fa-calendar-xmark','No meetings yet');
})();
</script>
</body>
</html>
