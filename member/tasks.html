<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Tasks — TaskHive</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(async function(){
  const session = buildShell('tasks.html');
  if (!session) return;
  Theme.init();
  const content = document.getElementById('thContent');
  let tasks = [], projects = [];

  content.innerHTML =
    '<div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">'+
      '<h4 class="mb-0"><i class="fa-solid fa-list-check me-2"></i>My Tasks</h4>'+
    '</div>'+
    '<div class="th-card mb-3"><div class="row g-2">'+
      '<div class="col-md-4"><select class="form-select" id="fProject"><option value="">All Projects</option></select></div>'+
      '<div class="col-md-4"><select class="form-select" id="fStatus"><option value="">All Statuses</option><option>Not Started</option><option>In Progress</option><option>Submitted</option><option>Approved</option><option>Needs Revision</option></select></div>'+
      '<div class="col-md-4"><select class="form-select" id="fPriority"><option value="">All Priorities</option><option>High</option><option>Medium</option><option>Low</option></select></div>'+
    '</div></div>'+
    '<div id="taskList" class="d-flex flex-column gap-2"></div>';

  function projectName(id){ const p = projects.find(x=>x.ProjectID===id); return p?p.ProjectName:'—'; }

  function render(){
    const fp=document.getElementById('fProject').value, fs=document.getElementById('fStatus').value, fpr=document.getElementById('fPriority').value;
    const list = tasks.filter(t=>{
      if (fp && t.ProjectID!==fp) return false;
      if (fs && t.Status!==fs) return false;
      if (fpr && t.Priority!==fpr) return false;
      return true;
    });
    const wrap = document.getElementById('taskList');
    if (!list.length){ wrap.innerHTML = thEmptyHtml('fa-inbox','No tasks match your filters'); return; }
    wrap.innerHTML = list.map(t=>{
      const checked = t.Checked === true || t.Checked === 'TRUE';
      const locked = t.Status === 'Submitted' || t.Status === 'Approved';
      return '<div class="th-task-row">'+
        '<input type="checkbox" class="form-check-input task-check" data-id="'+t.TaskID+'" '+(checked?'checked':'')+(locked?' disabled':'')+'>'+
        '<div class="flex-fill">'+
          '<div class="title">'+thEscape(t.TaskTitle)+'</div>'+
          '<div class="sub">'+thEscape(projectName(t.ProjectID))+' · Due '+thFmtDate(t.Deadline)+' · <span class="badge-status '+thPriorityBadgeClass(t.Priority)+'">'+t.Priority+'</span></div>'+
          (t.Remarks && t.Status==='Needs Revision' ? '<div class="mt-1" style="font-size:.8rem; color:var(--danger);"><i class="fa-solid fa-triangle-exclamation me-1"></i>'+thEscape(t.Remarks)+'</div>' : '')+
        '</div>'+
        '<span class="badge-status '+thStatusBadgeClass(t.Status)+'">'+t.Status+'</span>'+
        '<button class="btn btn-th-outline btn-sm view-btn" data-id="'+t.TaskID+'"><i class="fa-solid fa-eye"></i></button>'+
      '</div>';
    }).join('');

    wrap.querySelectorAll('.task-check').forEach(cb=>{
      cb.addEventListener('change', async function(){
        if (!this.checked) { this.checked = true; return; } // unchecking manually not allowed; revision resets it server-side
        this.disabled = true;
        const res = await Api.call('submitTask', {taskId:this.dataset.id, memberId:session.id, actorName:session.name});
        if (res.success){ thToast('Task submitted for review','success'); load(); }
        else { thToast(res.message,'error'); this.checked=false; this.disabled=false; }
      });
    });
    wrap.querySelectorAll('.view-btn').forEach(b=>b.onclick=()=>openView(list.find(t=>t.TaskID===b.dataset.id)));
  }

  async function load(){
    const [tr, pr] = await Promise.all([Api.call('getTasks'), Api.call('getProjects')]);
    if (tr.success) tasks = tr.data.filter(t=>t.AssignedMemberID===session.id);
    if (pr.success) { projects = pr.data;
      document.getElementById('fProject').innerHTML = '<option value="">All Projects</option>'+
        Array.from(new Set(tasks.map(t=>t.ProjectID))).map(id=>'<option value="'+id+'">'+thEscape(projectName(id))+'</option>').join('');
    }
    render();
  }
  ['fProject','fStatus','fPriority'].forEach(id=>document.getElementById(id).addEventListener('change', render));

  document.body.insertAdjacentHTML('beforeend',
    '<div class="modal fade" id="viewModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">'+
    '<div class="modal-header"><h5 class="modal-title">Task Details</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>'+
    '<div class="modal-body">'+
      '<h6 id="vwTitle"></h6><p class="text-secondary-th" id="vwDesc"></p>'+
      '<div style="font-size:.85rem;" class="mb-1"><strong>Project:</strong> <span id="vwProject"></span></div>'+
      '<div style="font-size:.85rem;" class="mb-1"><strong>Deadline:</strong> <span id="vwDeadline"></span></div>'+
      '<div style="font-size:.85rem;" class="mb-1"><strong>Status:</strong> <span id="vwStatus"></span></div>'+
      '<div style="font-size:.85rem;" class="mb-1"><strong>Revisions:</strong> <span id="vwRevisions"></span></div>'+
      '<div style="font-size:.85rem;"><strong>Admin Remarks:</strong> <span id="vwRemarks"></span></div>'+
    '</div><div class="modal-footer"><button class="btn btn-th-outline" data-bs-dismiss="modal">Close</button></div>'+
    '</div></div></div>'
  );
  const viewModal = new bootstrap.Modal(document.getElementById('viewModal'));
  function openView(t){
    document.getElementById('vwTitle').textContent = t.TaskTitle;
    document.getElementById('vwDesc').textContent = t.Description || 'No description';
    document.getElementById('vwProject').textContent = projectName(t.ProjectID);
    document.getElementById('vwDeadline').textContent = thFmtDate(t.Deadline);
    document.getElementById('vwStatus').innerHTML = '<span class="badge-status '+thStatusBadgeClass(t.Status)+'">'+t.Status+'</span>';
    document.getElementById('vwRevisions').textContent = t.RevisionCount || 0;
    document.getElementById('vwRemarks').textContent = t.Remarks || 'None yet';
    viewModal.show();
  }

  load();
})();
</script>
</body>
</html>
