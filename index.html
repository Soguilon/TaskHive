<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskHive — Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="th-login-wrap">
  <div class="th-login-card">
    <div class="brand"><i class="fa-solid fa-hexagon-nodes"></i><span>TaskHive</span></div>
    <div class="th-tabs">
      <button id="tabAdmin" class="active">Administrator</button>
      <button id="tabMember">Member</button>
    </div>

    <form id="adminForm">
      <div class="mb-3">
        <label>Username</label>
        <input type="text" class="form-control" id="adminUsername" required autocomplete="username">
      </div>
      <div class="mb-3">
        <label>Password</label>
        <input type="password" class="form-control" id="adminPassword" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-th-primary w-100"><i class="fa-solid fa-right-to-bracket me-2"></i>Login as Admin</button>
    </form>

    <form id="memberForm" class="d-none">
      <div class="mb-3">
        <label>Your Full Name</label>
        <input type="text" class="form-control" id="memberName" placeholder="e.g. Juan Dela Cruz" required>
      </div>
      <p class="text-secondary-th" style="font-size:.8rem;">No password needed — ask your administrator to add you as a member first.</p>
      <button type="submit" class="btn btn-th-primary w-100"><i class="fa-solid fa-right-to-bracket me-2"></i>Login as Member</button>
    </form>

    <div id="loginError" class="text-danger mt-3" style="font-size:.85rem; display:none;"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script>
  (function(){
    const stored = localStorage.getItem('taskhive_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', stored);
  })();

  // if already logged in, go straight to dashboard
  (function(){
    const s = Auth.get();
    if (s) window.location.href = (s.role === 'Admin' ? 'admin/dashboard.html' : 'member/dashboard.html');
  })();

  const tabAdmin = document.getElementById('tabAdmin');
  const tabMember = document.getElementById('tabMember');
  const adminForm = document.getElementById('adminForm');
  const memberForm = document.getElementById('memberForm');
  const errorBox = document.getElementById('loginError');

  tabAdmin.onclick = function(){
    tabAdmin.classList.add('active'); tabMember.classList.remove('active');
    adminForm.classList.remove('d-none'); memberForm.classList.add('d-none');
    errorBox.style.display='none';
  };
  tabMember.onclick = function(){
    tabMember.classList.add('active'); tabAdmin.classList.remove('active');
    memberForm.classList.remove('d-none'); adminForm.classList.add('d-none');
    errorBox.style.display='none';
  };

  function showError(msg){ errorBox.textContent = msg; errorBox.style.display='block'; }

  adminForm.addEventListener('submit', async function(e){
    e.preventDefault();
    const btn = adminForm.querySelector('button');
    btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Signing in...';
    const res = await Auth.loginAdmin(document.getElementById('adminUsername').value.trim(), document.getElementById('adminPassword').value);
    btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-right-to-bracket me-2"></i>Login as Admin';
    if (res.success) { window.location.href = 'admin/dashboard.html'; }
    else showError(res.message);
  });

  memberForm.addEventListener('submit', async function(e){
    e.preventDefault();
    const btn = memberForm.querySelector('button');
    btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Signing in...';
    const res = await Auth.loginMember(document.getElementById('memberName').value.trim());
    btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-right-to-bracket me-2"></i>Login as Member';
    if (res.success) {
      localStorage.setItem('taskhive_theme', res.data.theme || 'dark');
      window.location.href = 'member/dashboard.html';
    } else showError(res.message);
  });
</script>
</body>
</html>
