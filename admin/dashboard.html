<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — TaskHive Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(async function(){
  const session = buildShell('dashboard.html');
  if (!session) return;
  if (session.role !== 'Admin') { window.location.href = '../member/dashboard.html'; return; }
  Theme.init();

  const content = document.getElementById('thContent');
  content.innerHTML = thLoadingHtml('Crunching your project data...');

  const [projectsRes, tasksRes, membersRes, meetingsRes, calRes, logsRes, discRes] = await Promise.all([
    Api.call('getProjects'), Api.call('getTasks'), Api.call('getMembers'),
    Api.call('getMeetings'), Api.call('getCalendar'), Api.call('getActivityLogs'), Api.call('getDiscussions', {projectId:''})
  ]);

  if (!projectsRes.success) { content.innerHTML = '<div class="th-empty"><i class="fa-solid fa-triangle-exclamation"></i>' + projectsRes.message + '</div>'; return; }

  const projects = projectsRes.data;
  const tasks = tasksRes.success ? tasksRes.data : [];
  const members = membersRes.success ? membersRes.data : [];
  const meetings = meetingsRes.success ? meetingsRes.data : [];
  const events = calRes.success ? calRes.data : [];
  const logs = logsRes.success ? logsRes.data : [];

  const today = new Date().toISOString().slice(0,10);
  const stats = {
    totalProjects: projects.length,
    activeProjects: projects.filter(p=>p.Status==='Active').length,
    completedProjects: projects.filter(p=>p.Status==='Completed').length,
    totalMembers: members.length,
    pending: tasks.filter(t=>t.Status==='Not Started'||t.Status==='In Progress').length,
    submitted: tasks.filter(t=>t.Status==='Submitted').length,
    approved: tasks.filter(t=>t.Status==='Approved').length,
    needsRevision: tasks.filter(t=>t.Status==='Needs Revision').length,
    meetingsToday: meetings.filter(m=>m.Date===today).length,
    eventsToday: events.filter(e=>e.Date===today).length
  };

  function statCard(icon, val, lbl){
    return '<div class="th-card th-stat-card"><div class="icon"><i class="fa-solid '+icon+'"></i></div>'+
      '<div><div class="val">'+val+'</div><div class="lbl">'+lbl+'</div></div></div>';
  }

  const upcomingDeadlines = tasks.filter(t=>t.Deadline && t.Status!=='Approved')
    .sort((a,b)=>new Date(a.Deadline)-new Date(b.Deadline)).slice(0,5);
  const todaysEvents = events.filter(e=>e.Date===today);
  const recentDiscussions = discRes.success ? [] : [];

  content.innerHTML =
    '<div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">'+
    '<h4 class="mb-0">Welcome back, '+thEscape(session.name)+'</h4></div>'+
    '<div class="th-grid cols-4 mb-3">'+
      statCard('fa-folder', stats.totalProjects, 'Total Projects')+
      statCard('fa-diagram-project', stats.activeProjects, 'Active Projects')+
      statCard('fa-circle-check', stats.completedProjects, 'Completed Projects')+
      statCard('fa-users', stats.totalMembers, 'Total Members')+
    '</div>'+
    '<div class="th-grid cols-4 mb-3">'+
      statCard('fa-hourglass-half', stats.pending, 'Pending Tasks')+
      statCard('fa-paper-plane', stats.submitted, 'Submitted Tasks')+
      statCard('fa-square-check', stats.approved, 'Approved Tasks')+
      statCard('fa-triangle-exclamation', stats.needsRevision, 'Needs Revision')+
    '</div>'+
    '<div class="th-grid cols-2 mb-3">'+
      statCard('fa-calendar-check', stats.meetingsToday, "Meetings Today")+
      statCard('fa-calendar-day', stats.eventsToday, "Today's Events")+
    '</div>'+
    '<div class="th-grid cols-3">'+
      '<div class="th-card"><h6 class="mb-3"><i class="fa-solid fa-chart-line me-2"></i>Project Progress</h6><div id="progressList"></div></div>'+
      '<div class="th-card"><h6 class="mb-3"><i class="fa-solid fa-clock-rotate-left me-2"></i>Recent Activity</h6><div id="activityList"></div></div>'+
      '<div class="th-card"><h6 class="mb-3"><i class="fa-solid fa-calendar-days me-2"></i>Upcoming Deadlines</h6><div id="deadlineList"></div></div>'+
    '</div>';

  document.getElementById('progressList').innerHTML = projects.length ? projects.map(p=>
    '<div class="mb-3"><div class="d-flex justify-content-between mb-1" style="font-size:.85rem;"><span>'+thEscape(p.ProjectName)+'</span><span class="text-secondary-th">'+(p.Progress||0)+'%</span></div>'+
    '<div class="th-progress"><div class="th-progress-bar" style="width:'+(p.Progress||0)+'%;"></div></div></div>'
  ).join('') : thEmptyHtml('fa-folder-open','No projects yet');

  document.getElementById('activityList').innerHTML = logs.length ? logs.slice(0,10).map(l=>
    '<div class="mb-2" style="font-size:.82rem;"><strong>'+thEscape(l.UserName||'System')+'</strong> '+thEscape(l.Action)+
    '<div class="text-secondary-th" style="font-size:.72rem;">'+thFmtDateTime(l.DateTime)+'</div></div>'
  ).join('') : thEmptyHtml('fa-clock','No activity yet');

  document.getElementById('deadlineList').innerHTML = upcomingDeadlines.length ? upcomingDeadlines.map(t=>
    '<div class="mb-2 d-flex justify-content-between align-items-center" style="font-size:.82rem;">'+
    '<span>'+thEscape(t.TaskTitle)+'</span><span class="badge-status '+thStatusBadgeClass(t.Status)+'">'+thFmtDate(t.Deadline)+'</span></div>'
  ).join('') : thEmptyHtml('fa-calendar-check','No upcoming deadlines');
})();
</script>
</body>
</html>
