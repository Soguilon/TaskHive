<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activity Log — TaskHive Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(async function(){
  const session = buildShell('activity.html');
  if (!session) return;
  Theme.init();
  const content = document.getElementById('thContent');
  content.innerHTML = '<h4 class="mb-3"><i class="fa-solid fa-clock-rotate-left me-2"></i>Activity Log</h4>'+
    '<div class="th-card mb-3"><input class="form-control" id="searchLog" placeholder="Filter by user or action..."></div>'+
    '<div class="th-card"><div class="table-responsive-th"><table class="table-th"><thead><tr><th>User</th><th>Action</th><th>Date &amp; Time</th></tr></thead><tbody id="logBody"></tbody></table></div></div>';

  let logs = [];
  function render(){
    const q = document.getElementById('searchLog').value.toLowerCase();
    const list = logs.filter(l => !q || (l.UserName||'').toLowerCase().includes(q) || (l.Action||'').toLowerCase().includes(q));
    const body = document.getElementById('logBody');
    body.innerHTML = list.length ? list.map(l=>
      '<tr><td data-label="User">'+thEscape(l.UserName||'System')+'</td><td data-label="Action">'+thEscape(l.Action)+'</td><td data-label="Date">'+thFmtDateTime(l.DateTime)+'</td></tr>'
    ).join('') : '<tr><td colspan="3">'+thEmptyHtml('fa-clock','No activity recorded yet')+'</td></tr>';
  }
  document.getElementById('searchLog').addEventListener('input', render);

  const res = await Api.call('getActivityLogs');
  if (res.success){ logs = res.data; render(); }
  else content.innerHTML += thEmptyHtml('fa-triangle-exclamation', res.message);
})();
</script>
</body>
</html>
