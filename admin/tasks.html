<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Review — TaskHive Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(async function(){
  const session = buildShell('tasks.html');
  if (!session) return;
  Theme.init();
  const content = document.getElementById('thContent');
  let tasks=[], projects=[], members=[];

  content.innerHTML =
    '<div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">'+
      '<h4 class="mb-0"><i class="fa-solid fa-list-check me-2"></i>Task Review</h4>'+
      '<button class="btn btn-th-primary" id="newTaskBtn"><i class="fa-solid fa-plus me-2"></i>New Task</button>'+
    '</div>'+
    '<div class="th-card mb-3"><div class="row g-2">'+
      '<div class="col-md-3"><select class="form-select" id="fProject"><option value="">All Projects</option></select></div>'+
      '<div class="col-md-3"><select class="form-select" id="fMember"><option value="">All Members</option></select></div>'+
      '<div class="col-md-3"><select class="form-select" id="fStatus"><option value="">All Statuses</option><option>Not Started</option><option>In Progress</option><option>Submitted</option><option>Approved</option><option>Needs Revision</option></select></div>'+
      '<div class="col-md-3"><select class="form-select" id="fPriority"><option value="">All Priorities</option><option>High</option><option>Medium</option><option>Low</option></select></div>'+
    '</div></div>'+
    '<div class="th-card"><div class="table-responsive-th"><table class="table-th"><thead><tr>'+
      '<th>Task</th><th>Project</th><th>Member</th><th>Deadline</th><th>Submitted</th><th>Status</th><th>Actions</th>'+
    '</tr></thead><tbody id="taskBody"></tbody></table></div></div>';

  function memberName(id){ const m = members.find(x=>x.MemberID===id); return m?m.FullName:'Unassigned'; }
  function projectName(id){ const p = projects.find(x=>x.ProjectID===id); return p?p.ProjectName:'—'; }

  function render(){
    const fp=document.getElementById('fProject').value, fm=document.getElementById('fMember').value,
          fs=document.getElementById('fStatus').value, fpr=document.getElementById('fPriority').value;
    const list = tasks.filter(t=>{
      if (fp && t.ProjectID!==fp) return false;
      if (fm && t.AssignedMemberID!==fm) return false;
      if (fs && t.Status!==fs) return false;
      if (fpr && t.Priority!==fpr) return false;
      return true;
    });
    const body = document.getElementById('taskBody');
    if (!list.length){ body.innerHTML = '<tr><td colspan="7">'+thEmptyHtml('fa-inbox','No tasks match your filters')+'</td></tr>'; return; }
    body.innerHTML = list.map(t=>
      '<tr>'+
      '<td data-label="Task"><strong>'+thEscape(t.TaskTitle)+'</strong></td>'+
      '<td data-label="Project">'+thEscape(projectName(t.ProjectID))+'</td>'+
      '<td data-label="Member">'+thEscape(memberName(t.AssignedMemberID))+'</td>'+
      '<td data-label="Deadline">'+thFmtDate(t.Deadline)+'</td>'+
      '<td data-label="Submitted">'+(t.SubmissionDate?thFmtDate(t.SubmissionDate):'—')+'</td>'+
      '<td data-label="Status"><span class="badge-status '+thStatusBadgeClass(t.Status)+'">'+t.Status+'</span></td>'+
      '<td data-label="Actions"><button class="btn btn-th-outline btn-sm review-btn" data-id="'+t.TaskID+'"><i class="fa-solid fa-eye me-1"></i>Review</button> '+
      '<button class="btn btn-th-danger btn-sm del-btn" data-id="'+t.TaskID+'"><i class="fa-solid fa-trash"></i></button></td>'+
      '</tr>'
    ).join('');
    body.querySelectorAll('.review-btn').forEach(b=>b.onclick=()=>openReview(list.find(t=>t.TaskID===b.dataset.id)));
    body.querySelectorAll('.del-btn').forEach(b=>b.onclick=()=>delTask(b.dataset.id));
  }

  async function delTask(id){
    if(!confirm('Delete this task permanently?')) return;
    const t = tasks.find(x=>x.TaskID===id);
    const res = await Api.call('deleteTask', {taskId:id, projectId:t?t.ProjectID:'', actorId:session.id, actorName:session.name});
    if (res.success){ thToast('Task deleted','success'); load(); } else thToast(res.message,'error');
  }

  async function load(){
    const [tr, pr, mr] = await Promise.all([Api.call('getTasks'), Api.call('getProjects'), Api.call('getMembers')]);
    if (tr.success) tasks = tr.data;
    if (pr.success) { projects = pr.data;
      document.getElementById('fProject').innerHTML = '<option value="">All Projects</option>'+projects.map(p=>'<option value="'+p.ProjectID+'">'+thEscape(p.ProjectName)+'</option>').join('');
      document.getElementById('taskProjectSel').innerHTML = projects.map(p=>'<option value="'+p.ProjectID+'">'+thEscape(p.ProjectName)+'</option>').join('');
    }
    if (mr.success) { members = mr.data.filter(m=>m.Status==='Active');
      document.getElementById('fMember').innerHTML = '<option value="">All Members</option>'+members.map(m=>'<option value="'+m.MemberID+'">'+thEscape(m.FullName)+'</option>').join('');
      document.getElementById('taskMemberSel').innerHTML = members.map(m=>'<option value="'+m.MemberID+'">'+thEscape(m.FullName)+'</option>').join('');
    }
    render();
  }
  ['fProject','fMember','fStatus','fPriority'].forEach(id=>document.getElementById(id).addEventListener('change', render));

  /* -------- New Task Modal -------- */
  document.body.insertAdjacentHTML('beforeend',
    '<div class="modal fade" id="taskModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">'+
    '<div class="modal-header"><h5 class="modal-title">New Task</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>'+
    '<div class="modal-body">'+
      '<div class="mb-3"><label>Task Title *</label><input class="form-control" id="taskTitleInput"></div>'+
      '<div class="mb-3"><label>Description</label><textarea class="form-control" id="taskDescInput" rows="3"></textarea></div>'+
      '<div class="row g-2 mb-3">'+
        '<div class="col-6"><label>Project *</label><select class="form-select" id="taskProjectSel"></select></div>'+
        '<div class="col-6"><label>Assign to *</label><select class="form-select" id="taskMemberSel"></select></div>'+
      '</div>'+
      '<div class="row g-2 mb-3">'+
        '<div class="col-6"><label>Priority</label><select class="form-select" id="taskPrioritySel"><option>Low</option><option selected>Medium</option><option>High</option></select></div>'+
        '<div class="col-6"><label>Deadline</label><input type="date" class="form-control" id="taskDeadlineInput"></div>'+
      '</div>'+
      '<div id="taskError" class="text-danger" style="font-size:.85rem; display:none;"></div>'+
    '</div><div class="modal-footer"><button class="btn btn-th-outline" data-bs-dismiss="modal">Cancel</button><button class="btn btn-th-primary" id="taskSaveBtn">Create Task</button></div>'+
    '</div></div></div>'
  );
  const taskModal = new bootstrap.Modal(document.getElementById('taskModal'));
  document.getElementById('newTaskBtn').onclick = ()=>{
    document.getElementById('taskTitleInput').value='';
    document.getElementById('taskDescInput').value='';
    document.getElementById('taskDeadlineInput').value='';
    document.getElementById('taskError').style.display='none';
    taskModal.show();
  };
  document.getElementById('taskSaveBtn').onclick = async function(){
    const title = document.getElementById('taskTitleInput').value.trim();
    const errBox = document.getElementById('taskError');
    if (!title){ errBox.textContent='Task title cannot be empty.'; errBox.style.display='block'; return; }
    const res = await Api.call('addTask', {
      taskTitle:title, description:document.getElementById('taskDescInput').value,
      projectId:document.getElementById('taskProjectSel').value, assignedMemberId:document.getElementById('taskMemberSel').value,
      priority:document.getElementById('taskPrioritySel').value, deadline:document.getElementById('taskDeadlineInput').value,
      actorId:session.id, actorName:session.name
    });
    if (res.success){ thToast('Task created','success'); taskModal.hide(); load(); }
    else { errBox.textContent = res.message; errBox.style.display='block'; }
  };

  /* -------- Review Modal -------- */
  document.body.insertAdjacentHTML('beforeend',
    '<div class="modal fade" id="reviewModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">'+
    '<div class="modal-header"><h5 class="modal-title">Review Task</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>'+
    '<div class="modal-body">'+
      '<h6 id="rvTitle"></h6>'+
      '<p class="text-secondary-th" id="rvDesc"></p>'+
      '<div class="row mb-2" style="font-size:.85rem;"><div class="col-6"><strong>Member:</strong> <span id="rvMember"></span></div><div class="col-6"><strong>Submitted:</strong> <span id="rvSubmitted"></span></div></div>'+
      '<div class="mb-2" style="font-size:.85rem;"><strong>Status:</strong> <span id="rvStatus"></span></div>'+
      '<div class="mb-3"><label>Remarks</label><textarea class="form-control" id="rvRemarks" rows="3" placeholder="Required if requesting revision"></textarea></div>'+
      '<div id="rvError" class="text-danger" style="font-size:.85rem; display:none;"></div>'+
    '</div><div class="modal-footer">'+
      '<button class="btn btn-th-danger" id="rvReviseBtn"><i class="fa-solid fa-triangle-exclamation me-1"></i>Needs Revision</button>'+
      '<button class="btn btn-th-primary" id="rvApproveBtn"><i class="fa-solid fa-circle-check me-1"></i>Approve</button>'+
    '</div></div></div></div>'
  );
  const reviewModal = new bootstrap.Modal(document.getElementById('reviewModal'));
  let currentTask = null;
  function openReview(t){
    currentTask = t;
    document.getElementById('rvTitle').textContent = t.TaskTitle;
    document.getElementById('rvDesc').textContent = t.Description || 'No description';
    document.getElementById('rvMember').textContent = memberName(t.AssignedMemberID);
    document.getElementById('rvSubmitted').textContent = t.SubmissionDate ? thFmtDateTime(t.SubmissionDate) : 'Not yet submitted';
    document.getElementById('rvStatus').innerHTML = '<span class="badge-status '+thStatusBadgeClass(t.Status)+'">'+t.Status+'</span>';
    document.getElementById('rvRemarks').value = t.Remarks || '';
    document.getElementById('rvError').style.display = 'none';
    reviewModal.show();
  }
  document.getElementById('rvApproveBtn').onclick = async function(){
    const res = await Api.call('approveTask', {taskId: currentTask.TaskID, remarks: document.getElementById('rvRemarks').value, actorId: session.id, actorName: session.name});
    if (res.success){ thToast('Task approved','success'); reviewModal.hide(); load(); } else thToast(res.message,'error');
  };
  document.getElementById('rvReviseBtn').onclick = async function(){
    const remarks = document.getElementById('rvRemarks').value.trim();
    const errBox = document.getElementById('rvError');
    if (!remarks){ errBox.textContent='A remark is required to request revision.'; errBox.style.display='block'; return; }
    const res = await Api.call('requestRevision', {taskId: currentTask.TaskID, remarks: remarks, actorId: session.id, actorName: session.name});
    if (res.success){ thToast('Revision requested','success'); reviewModal.hide(); load(); } else { errBox.textContent=res.message; errBox.style.display='block'; }
  };

  load();
})();
</script>
</body>
</html>
