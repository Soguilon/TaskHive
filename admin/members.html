<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Members — TaskHive Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(async function(){
  const session = buildShell('members.html');
  if (!session) return;
  Theme.init();
  const content = document.getElementById('thContent');
  let members = [];

  content.innerHTML =
    '<div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">'+
      '<h4 class="mb-0"><i class="fa-solid fa-users me-2"></i>Members</h4>'+
      '<button class="btn btn-th-primary" id="newMemberBtn"><i class="fa-solid fa-plus me-2"></i>Add Member</button>'+
    '</div>'+
    '<div class="th-card"><div class="table-responsive-th"><table class="table-th"><thead><tr>'+
      '<th>Name</th><th>Course</th><th>Email</th><th>Status</th><th>Date Added</th><th>Actions</th>'+
    '</tr></thead><tbody id="memberBody"></tbody></table></div></div>';

  function render(){
    const body = document.getElementById('memberBody');
    if (!members.length){ body.innerHTML = '<tr><td colspan="6">'+thEmptyHtml('fa-user-slash','No members yet. Add your first member.')+'</td></tr>'; return; }
    body.innerHTML = members.map(m=>
      '<tr>'+
      '<td data-label="Name"><strong>'+thEscape(m.FullName)+'</strong></td>'+
      '<td data-label="Course">'+thEscape(m.Course||'—')+'</td>'+
      '<td data-label="Email">'+thEscape(m.Email||'—')+'</td>'+
      '<td data-label="Status"><span class="badge-status '+(m.Status==='Active'?'badge-approved':'badge-needs-revision')+'">'+m.Status+'</span></td>'+
      '<td data-label="Added">'+thFmtDate(m.DateCreated)+'</td>'+
      '<td data-label="Actions">'+
        '<button class="btn btn-th-outline btn-sm edit-btn" data-id="'+m.MemberID+'"><i class="fa-solid fa-pen-to-square"></i></button> '+
        '<button class="btn btn-th-outline btn-sm toggle-btn" data-id="'+m.MemberID+'">'+(m.Status==='Active'?'<i class="fa-solid fa-user-slash"></i>':'<i class="fa-solid fa-user-check"></i>')+'</button> '+
        '<button class="btn btn-th-danger btn-sm del-btn" data-id="'+m.MemberID+'"><i class="fa-solid fa-trash"></i></button>'+
      '</td></tr>'
    ).join('');
    body.querySelectorAll('.edit-btn').forEach(b=>b.onclick=()=>openModal(members.find(m=>m.MemberID===b.dataset.id)));
    body.querySelectorAll('.toggle-btn').forEach(b=>b.onclick=()=>toggleStatus(b.dataset.id));
    body.querySelectorAll('.del-btn').forEach(b=>b.onclick=()=>delMember(b.dataset.id));
  }

  async function load(){
    const res = await Api.call('getMembers');
    if (res.success){ members = res.data; render(); }
  }

  async function toggleStatus(id){
    const m = members.find(x=>x.MemberID===id);
    const newStatus = m.Status === 'Active' ? 'Inactive' : 'Active';
    const res = await Api.call('updateMember', {memberId:id, Status:newStatus, actorId:session.id, actorName:session.name});
    if (res.success){ thToast('Member '+newStatus.toLowerCase(),'success'); load(); } else thToast(res.message,'error');
  }
  async function delMember(id){
    if (!confirm('Delete this member permanently? This cannot be undone.')) return;
    const res = await Api.call('deleteMember', {memberId:id, actorId:session.id, actorName:session.name});
    if (res.success){ thToast('Member deleted','success'); load(); } else thToast(res.message,'error');
  }

  document.body.insertAdjacentHTML('beforeend',
    '<div class="modal fade" id="memModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">'+
    '<div class="modal-header"><h5 class="modal-title" id="memModalTitle">Add Member</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>'+
    '<div class="modal-body">'+
      '<input type="hidden" id="mId">'+
      '<div class="mb-3"><label>Full Name *</label><input class="form-control" id="mName"></div>'+
      '<div class="row g-2 mb-3">'+
        '<div class="col-6"><label>Course</label><input class="form-control" id="mCourse"></div>'+
        '<div class="col-6"><label>Email</label><input type="email" class="form-control" id="mEmail"></div>'+
      '</div>'+
      '<div id="mError" class="text-danger" style="font-size:.85rem; display:none;"></div>'+
    '</div><div class="modal-footer"><button class="btn btn-th-outline" data-bs-dismiss="modal">Cancel</button><button class="btn btn-th-primary" id="mSaveBtn">Save</button></div>'+
    '</div></div></div>'
  );
  const memModal = new bootstrap.Modal(document.getElementById('memModal'));
  document.getElementById('newMemberBtn').onclick = ()=>openModal(null);
  function openModal(m){
    document.getElementById('memModalTitle').textContent = m ? 'Edit Member' : 'Add Member';
    document.getElementById('mId').value = m ? m.MemberID : '';
    document.getElementById('mName').value = m ? m.FullName : '';
    document.getElementById('mCourse').value = m ? m.Course : '';
    document.getElementById('mEmail').value = m ? m.Email : '';
    document.getElementById('mError').style.display='none';
    memModal.show();
  }
  document.getElementById('mSaveBtn').onclick = async function(){
    const name = document.getElementById('mName').value.trim();
    const errBox = document.getElementById('mError');
    if (!name){ errBox.textContent='Member name cannot be empty.'; errBox.style.display='block'; return; }
    const id = document.getElementById('mId').value;
    const payload = { fullName:name, course:document.getElementById('mCourse').value, email:document.getElementById('mEmail').value, actorId:session.id, actorName:session.name };
    const res = id ? await Api.call('updateMember', Object.assign({memberId:id, FullName:name, Course:payload.course, Email:payload.email}, {actorId:session.id, actorName:session.name})) : await Api.call('addMember', payload);
    if (res.success){ thToast(res.message,'success'); memModal.hide(); load(); } else { errBox.textContent=res.message; errBox.style.display='block'; }
  };

  load();
})();
</script>
</body>
</html>
